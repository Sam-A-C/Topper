databases:
  - name: topper-db
    databaseName: topper
    user: topper
    plan: free

services:
  - type: web
    name: topper
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      # Wired automatically from the database above — never set by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: topper-db
          property: connectionString

      # Generated by Render and kept out of the repo.
      - key: SESSION_SECRET
        generateValue: true

      # Prompted for on deploy; not stored in version control.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Makes the session cookie Secure.
      - key: NODE_ENV
        value: production

      - key: CORS_ORIGIN
        value: "https://topper-b4rv.onrender.com"

    # PORT is deliberately unset: Render injects it, and server.js falls back
    # to 3000 only when it is absent. Hardcoding it fights the platform.
