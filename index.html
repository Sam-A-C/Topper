<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topper — Battle Recorder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Home screen ───────────────────────────────────────────────────── -->
<div id="screen-home">
  <div class="home-card">
    <h1>TOPPER</h1>
    <p class="subtitle">40k battle recorder</p>

    <div class="home-actions">
      <button id="btn-start" class="btn-accent">New Battle</button>

      <button id="btn-show-join" class="btn-ghost">Join</button>
      <div id="join-form" class="hidden">
        <input id="join-token-input" type="text" maxlength="6"
               placeholder="XXXXXX" autocomplete="off" spellcheck="false" />
        <button id="btn-join" class="btn-accent">Go</button>
      </div>
    </div>

    <p class="home-error hidden" id="home-error"></p>
  </div>
</div>

<!-- ── Battle screen ─────────────────────────────────────────────────── -->
<div id="screen-battle" class="hidden">

  <!-- top bar: token + phase stepper -->
  <div id="topbar">
    <div id="token-badge" class="token-badge" title="Click to copy token">
      <span id="topbar-token">------</span>
      <span class="copy-hint">copy</span>
    </div>

    <div id="stepper">
      <button id="btn-step-back" class="step-btn" title="Previous phase">‹</button>
      <div id="stepper-readout">
        <span id="cursor-round">R1</span>
        <span class="cursor-sep">·</span>
        <span id="cursor-side">Player A</span>
        <span class="cursor-sep">·</span>
        <span id="cursor-phase">Command</span>
      </div>
      <button id="btn-step-fwd" class="step-btn" title="Next phase">›</button>
    </div>

    <div class="spacer"></div>
    <button id="btn-report" class="btn-ghost">Report</button>
    <button id="btn-leave"  class="btn-ghost">Leave</button>
  </div>

  <!-- phase rail -->
  <div id="phase-rail"></div>

  <div id="battle-body">

    <div id="canvas-wrap">
      <canvas id="battle-canvas"></canvas>

      <!-- phase-contextual entry bar -->
      <div id="entry-bar"></div>

      <div id="context-menu" class="hidden">
        <div class="ctx-item" data-action="deploy">Deploy here</div>
        <div class="ctx-item" data-action="destroy" id="ctx-destroy">Mark destroyed</div>
        <hr class="ctx-sep" />
        <div class="ctx-item" data-action="remove-unit" id="ctx-remove">Remove from roster</div>
      </div>
    </div>

    <div id="sidebar">
      <div id="score-strip">
        <div class="score-side" data-side="A">
          <span class="score-name" id="score-name-A">Player A</span>
          <span class="score-vp"   id="score-vp-A">0</span>
          <span class="score-cp"   id="score-cp-A">0 CP</span>
        </div>
        <div class="score-side" data-side="B">
          <span class="score-name" id="score-name-B">Player B</span>
          <span class="score-vp"   id="score-vp-B">0</span>
          <span class="score-cp"   id="score-cp-B">0 CP</span>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>
          Roster
          <button id="btn-add-unit" class="mini-btn" title="Add unit">+</button>
        </h3>
        <ul id="roster-list"></ul>
      </div>

      <div class="sidebar-section grow">
        <h3>
          Log
          <button id="btn-undo" class="mini-btn" title="Undo last event">⤺</button>
        </h3>
        <ul id="event-log"></ul>
      </div>

      <div class="sidebar-section">
        <h3>Recording</h3>
        <ul id="player-list"></ul>
      </div>
    </div>

  </div>
</div>

<!-- ── Report screen ─────────────────────────────────────────────────── -->
<div id="screen-report" class="hidden">
  <div id="report-topbar">
    <button id="btn-back-to-battle" class="btn-ghost">‹ Back</button>
    <div class="spacer"></div>
    <button id="btn-replay"   class="btn-ghost">▶ Replay</button>
    <button id="btn-record"   class="btn-ghost">● Export video</button>
    <button id="btn-export-json" class="btn-ghost">Export JSON</button>
  </div>
  <div id="report-body"></div>
</div>

<!-- ── Add-unit modal ────────────────────────────────────────────────── -->
<div id="unit-modal" class="hidden modal-backdrop">
  <div class="modal-box">
    <p class="modal-title">Add to roster</p>

    <label class="field">
      <span>Name</span>
      <input id="unit-name" type="text" maxlength="40" placeholder="e.g. Intercessors" />
    </label>

    <label class="field">
      <span>Kind</span>
      <select id="unit-kind">
        <option value="unit">Unit</option>
        <option value="terrain">Terrain</option>
        <option value="objective">Objective</option>
      </select>
    </label>

    <label class="field" id="field-side">
      <span>Side</span>
      <select id="unit-side">
        <option value="A">Player A</option>
        <option value="B">Player B</option>
      </select>
    </label>

    <label class="field" id="field-strength">
      <span>Models</span>
      <input id="unit-strength" type="number" min="1" max="99" value="10" />
    </label>

    <div class="modal-actions">
      <button id="unit-cancel" class="btn-ghost">Cancel</button>
      <button id="unit-ok"     class="btn-accent">Add</button>
    </div>
  </div>
</div>

<!-- toast -->
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="socket-client.js"></script>
<script src="battle.js"></script>
<script src="app.js"></script>
</body>
</html>
